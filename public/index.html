<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Game</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141a2a;
      color: #f5f7fb;
      padding: 16px;
      box-sizing: border-box;
    }
    main { text-align: center; max-width: 420px; width: 100%; }
    h1 { font-size: 2.6rem; margin: 0 0 8px; }
    p { color: #9aa5bd; }
    a {
      display: block;
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.15rem;
      text-decoration: none;
      color: #f5f7fb;
      background: rgba(255, 255, 255, 0.12);
    }
    a.primary { background: #ffb020; color: #1b1300; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Party Game</h1>
    <p>Mở màn hình chung trên TV/laptop, cả nhà quét mã QR bằng điện thoại để vào chơi: 🏁 Đua thú, ⚡ Phản xạ…</p>
    <a class="primary" href="/host">📺 Tạo phòng (màn hình chung)</a>
    <a href="/play">📱 Vào chơi bằng mã phòng</a>
  </main>
</body>
</html>
