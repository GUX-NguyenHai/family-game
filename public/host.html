<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="host.title">Party Game</title>
  <link rel="stylesheet" href="/css/host.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Game đang chọn tự vẽ vào đây (cả lúc ở phòng chờ, làm nền phía sau). -->
  <div id="game"></div>

  <div id="countdown" hidden></div>
  <div id="toasts"></div>

  <!-- Chữ giao diện: data-i18n* điền theo ngôn ngữ (/i18n/vi.json, en.json, xem /js/core/i18n.js) -->
  <!-- Phòng chờ: thanh trên cùng + [chọn game] [khoảng trống thấy cảnh 3D, khung Bắt đầu ở dưới] [QR + người chơi] -->
  <section id="lobby" class="panel" hidden>
    <header class="lobby-top">
      <h1>🎮 Party Game</h1>
      <span id="tierBadge" class="badge"></span>
      <button id="btnLang" class="icon lang"></button>
      <button id="btnSettings" class="icon" data-i18n-title="host.settings" aria-expanded="false" aria-controls="settings">⚙️</button>
      <!-- Cài đặt ít dùng: mã Pro, đồ hoạ, toàn màn hình, link vào phòng, version -->
      <div id="settings" class="settings" hidden>
        <div class="tier">
          <div class="tier-row">
            <b data-i18n="host.plan"></b>
            <button id="btnShowLicense" class="link"></button>
            <button id="btnRemoveLicense" class="link" data-i18n="host.removePro" hidden></button>
          </div>
          <form id="licenseForm" class="license-form" hidden>
            <input id="licenseInput" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XX" autocomplete="off" spellcheck="false">
            <button type="submit" class="primary" data-i18n="host.activate"></button>
          </form>
          <p id="licenseMsg" class="license-msg" hidden></p>
        </div>
        <div class="buttons small">
          <button id="btnQuality"></button>
          <button id="btnFullscreen" data-i18n="host.fullscreen"></button>
        </div>
        <p class="hint"><span data-i18n="host.joinLink"></span> <span id="joinUrl" class="url"></span></p>
        <p id="appVersion" class="hint"></p>
      </div>
    </header>

    <aside class="game-sidebar" data-i18n-aria="host.chooseGame">
      <div class="game-list" role="radiogroup"></div>
      <!-- Quảng cáo (chỉ ở phòng chờ, xem /js/core/ads.js) -->
      <div id="adHost" class="ad-box" hidden></div>
    </aside>

    <div class="lobby-center">
      <!-- Trái: tên game + nhãn + mô tả + lựa chọn; phải: nút Bắt đầu vuông -->
      <div class="start-card">
        <div class="start-main">
          <div class="game-head">
            <h2 class="game-title"></h2>
            <p class="game-tags"></p>
            <p class="game-desc"></p>
          </div>
          <div class="game-options compact"></div>
          <!-- Chỉ hiện khi game đang chơi theo đội -->
          <div id="teamBar" class="team-bar" hidden>
            <span id="teamSummary"></span>
            <button id="btnShuffleTeams" data-i18n="host.shuffleTeams"></button>
          </div>
        </div>
        <button id="btnStart" class="primary start" disabled></button>
      </div>
    </div>

    <div class="lobby-side">
      <div class="join">
        <img id="qr" data-i18n-alt="host.qrAlt">
        <div class="code"><span data-i18n="host.roomCode"></span> <b id="roomCode">----</b></div>
        <p class="sub" data-i18n="host.scanToJoin"></p>
        <p id="urlWarn" class="warn" hidden></p>
      </div>
      <div class="players">
        <h2><span data-i18n="host.players"></span> <span id="playerCount">0</span></h2>
        <ul id="playerList"></ul>
        <p id="emptyHint" class="hint" data-i18n="host.empty"></p>
        <div class="buttons small">
          <button id="btnAddBot" data-i18n="host.addBot"></button>
          <button id="btnClearBots" data-i18n="host.clearBots"></button>
        </div>
      </div>
    </div>
  </section>

  <section id="results" class="panel" hidden>
    <div class="results-inner">
      <h1 data-i18n="host.results"></h1>
      <ol id="resultList"></ol>
      <div class="game-options" data-prefix-key="host.nextRound"></div>
      <div class="buttons">
        <button id="btnAgain" class="primary" data-i18n="host.again"></button>
        <button id="btnLobby" data-i18n="host.toLobby"></button>
      </div>
    </div>
  </section>

  <div id="loading">Đang tải… / Loading…</div>

  <script>
    // Có lỗi lúc tải thì hiện lên màn hình thay vì kẹt ở "Đang tải…".
    (function () {
      function show(msg) {
        var el = document.getElementById('loading');
        if (el && !el.hidden) el.textContent = 'Lỗi / Error: ' + msg + ' (Ctrl+Shift+R)';
      }
      window.addEventListener('error', function (e) { show(e.message || (e.target && e.target.src) || 'file'); }, true);
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || String(e.reason)); });
    })();
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/core/host.js"></script>
</body>
</html>
