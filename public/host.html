<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đua thú – Màn hình chung</title>
  <link rel="stylesheet" href="/css/host.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" hidden>
    <ol id="standings"></ol>
    <div id="progress"><div class="finish">🏁</div></div>
  </div>

  <div id="countdown" hidden></div>
  <div id="toasts"></div>

  <section id="lobby" class="panel" hidden>
    <div class="join">
      <h1>🏁 Đua thú</h1>
      <p class="sub">Quét mã để vào chơi</p>
      <img id="qr" alt="Mã QR vào phòng">
      <div class="code">Mã phòng: <b id="roomCode">----</b></div>
      <div id="joinUrl" class="url"></div>
      <p id="urlWarn" class="warn" hidden></p>
    </div>
    <div class="players">
      <h2>Người chơi <span id="playerCount">0</span></h2>
      <div class="tier">
        <div class="tier-row">
          <span id="tierBadge" class="badge">🆓 Miễn phí · tối đa 4 người</span>
          <button id="btnShowLicense" class="link">Nhập mã Pro</button>
          <button id="btnRemoveLicense" class="link" hidden>Gỡ mã</button>
        </div>
        <form id="licenseForm" class="license-form" hidden>
          <input id="licenseInput" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XX" autocomplete="off" spellcheck="false">
          <button type="submit" class="primary">Kích hoạt</button>
        </form>
        <p id="licenseMsg" class="license-msg" hidden></p>
      </div>
      <ul id="playerList"></ul>
      <p id="emptyHint" class="hint">Chưa có ai. Mời cả nhà quét mã nào!</p>
      <div class="difficulty" role="radiogroup" aria-label="Độ khó">
        <span class="label">Độ khó:</span>
        <button data-level="easy">🟢 Dễ</button>
        <button data-level="normal">🟡 Trung bình</button>
        <button data-level="hard">🔴 Khó</button>
      </div>
      <p class="difficulty-desc"></p>
      <div class="buttons">
        <button id="btnStart" class="primary" disabled>▶ Bắt đầu đua</button>
        <button id="btnAddBot">+ Thêm bot</button>
        <button id="btnClearBots">Xoá bot</button>
      </div>
      <div class="buttons small">
        <button id="btnQuality"></button>
        <button id="btnFullscreen">⛶ Toàn màn hình</button>
      </div>
    </div>
  </section>

  <section id="results" class="panel" hidden>
    <div class="results-inner">
      <h1>🏆 Kết quả</h1>
      <ol id="resultList"></ol>
      <div class="difficulty" role="radiogroup" aria-label="Độ khó">
        <span class="label">Ván sau:</span>
        <button data-level="easy">🟢 Dễ</button>
        <button data-level="normal">🟡 Trung bình</button>
        <button data-level="hard">🔴 Khó</button>
      </div>
      <div class="buttons">
        <button id="btnAgain" class="primary">↻ Đua lại</button>
        <button id="btnLobby">Về phòng chờ</button>
      </div>
    </div>
  </section>

  <div id="loading">Đang tải…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/host/main.js"></script>
</body>
</html>
