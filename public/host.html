<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Game – Màn hình chung</title>
  <link rel="stylesheet" href="/css/host.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Game đang chọn tự vẽ vào đây (cả lúc ở phòng chờ, làm nền phía sau). -->
  <div id="game"></div>

  <div id="countdown" hidden></div>
  <div id="toasts"></div>

  <!-- Phòng chờ: thanh trên cùng + [chọn game] [khoảng trống thấy cảnh 3D, khung Bắt đầu ở dưới] [QR + người chơi] -->
  <section id="lobby" class="panel" hidden>
    <header class="lobby-top">
      <h1>🎮 Party Game</h1>
      <span id="tierBadge" class="badge">🆓 Miễn phí · tối đa 4 người</span>
      <button id="btnSettings" class="icon" title="Cài đặt" aria-expanded="false" aria-controls="settings">⚙️</button>
      <!-- Cài đặt ít dùng: mã Pro, đồ hoạ, toàn màn hình, link vào phòng, version -->
      <div id="settings" class="settings" hidden>
        <div class="tier">
          <div class="tier-row">
            <b>Gói</b>
            <button id="btnShowLicense" class="link">Nhập mã Pro</button>
            <button id="btnRemoveLicense" class="link" hidden>Gỡ mã</button>
          </div>
          <form id="licenseForm" class="license-form" hidden>
            <input id="licenseInput" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XX" autocomplete="off" spellcheck="false">
            <button type="submit" class="primary">Kích hoạt</button>
          </form>
          <p id="licenseMsg" class="license-msg" hidden></p>
        </div>
        <div class="buttons small">
          <button id="btnQuality"></button>
          <button id="btnFullscreen">⛶ Toàn màn hình</button>
        </div>
        <p class="hint">Không quét được mã QR thì mở link: <span id="joinUrl" class="url"></span></p>
        <p id="appVersion" class="hint"></p>
      </div>
    </header>

    <aside class="game-sidebar" aria-label="Chọn game">
      <div class="game-list" role="radiogroup"></div>
      <!-- Quảng cáo (chỉ ở phòng chờ, xem /js/core/ads.js) -->
      <div id="adHost" class="ad-box" hidden></div>
    </aside>

    <div class="lobby-center">
      <!-- Trái: tên game + nhãn + mô tả + lựa chọn; phải: nút Bắt đầu vuông -->
      <div class="start-card">
        <div class="start-main">
          <div class="game-head">
            <h2 class="game-title"></h2>
            <p class="game-tags"></p>
            <p class="game-desc"></p>
          </div>
          <div class="game-options compact"></div>
          <!-- Chỉ hiện khi game đang chơi theo đội -->
          <div id="teamBar" class="team-bar" hidden>
            <span id="teamSummary"></span>
            <button id="btnShuffleTeams">🎲 Chia đội ngẫu nhiên</button>
          </div>
        </div>
        <button id="btnStart" class="primary start" disabled>▶ Bắt đầu</button>
      </div>
    </div>

    <div class="lobby-side">
      <div class="join">
        <img id="qr" alt="Mã QR vào phòng">
        <div class="code">Mã phòng <b id="roomCode">----</b></div>
        <p class="sub">Quét mã bằng điện thoại để vào chơi</p>
        <p id="urlWarn" class="warn" hidden></p>
      </div>
      <div class="players">
        <h2>Người chơi <span id="playerCount">0</span></h2>
        <ul id="playerList"></ul>
        <p id="emptyHint" class="hint">Chưa có ai. Mời cả nhà quét mã nào!</p>
        <div class="buttons small">
          <button id="btnAddBot">+ Thêm bot</button>
          <button id="btnClearBots">Xoá bot</button>
        </div>
      </div>
    </div>
  </section>

  <section id="results" class="panel" hidden>
    <div class="results-inner">
      <h1>🏆 Kết quả</h1>
      <ol id="resultList"></ol>
      <div class="game-options" data-prefix="Ván sau · "></div>
      <div class="buttons">
        <button id="btnAgain" class="primary">↻ Chơi lại</button>
        <button id="btnLobby">Về phòng chờ / đổi game</button>
      </div>
    </div>
  </section>

  <div id="loading">Đang tải…</div>

  <script>
    // Có lỗi lúc tải thì hiện lên màn hình thay vì kẹt ở "Đang tải…".
    (function () {
      function show(msg) {
        var el = document.getElementById('loading');
        if (el && !el.hidden) el.textContent = 'Lỗi: ' + msg + ' (thử Ctrl+Shift+R để tải lại)';
      }
      window.addEventListener('error', function (e) { show(e.message || 'không tải được ' + (e.target && e.target.src || 'tệp')); }, true);
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || String(e.reason)); });
    })();
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/core/host.js"></script>
</body>
</html>
