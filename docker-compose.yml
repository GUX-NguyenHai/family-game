services:
  party-game:
    build: .
    image: party-game
    container_name: party-game
    restart: unless-stopped
    ports:
      # Chỉ mở cho nginx trên cùng máy. Muốn truy cập thẳng từ ngoài thì đổi thành "3000:3000".
      - "127.0.0.1:3000:3000"
    # Biến môi trường: lấy từ file .env cạnh file này nếu có, không có thì dùng giá trị sau dấu ":-".
    environment:
      # Khoá ký mã Pro. Trống = tắt Pro.
      - LICENSE_SECRET=${LICENSE_SECRET:-}
      # Quảng cáo Google AdSense. Trống = không hiện quảng cáo.
      - ADSENSE_CLIENT=${ADSENSE_CLIENT:-}
      - ADSENSE_SLOT_HOST=${ADSENSE_SLOT_HOST:-}
      - ADSENSE_SLOT_PLAY=${ADSENSE_SLOT_PLAY:-}
      # Email liên hệ hiện ở chân trang giới thiệu/chính sách bảo mật (tuỳ chọn).
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      # Mật khẩu trang /admin (upload game .zip). Trống = tắt trang quản trị.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-GUX@2023}
    volumes:
      # Game upload qua /admin. Volume riêng nên build lại, git pull, xoá image đều không mất.
      # (Chỉ mất nếu chạy "docker compose down -v" hoặc "docker volume rm".)
      - games-installed:/app/games-installed
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  games-installed:
