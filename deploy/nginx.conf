# Đặt file này vào /etc/nginx/sites-available/dua-thu rồi symlink sang sites-enabled.
# Domain miễn phí theo IP server 103.185.185.188 (dấu chấm đổi thành gạch ngang).
# Sau khi nginx chạy được ở cổng 80, chạy certbot để tự thêm HTTPS:
#   certbot --nginx -d 103-185-185-188.sslip.io --redirect

server {
    listen 80;
    server_name 103-185-185-188.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Bắt buộc cho WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không cắt kết nối socket đang mở lâu
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
